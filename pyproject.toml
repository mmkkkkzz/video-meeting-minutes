[project]
name = "video-meeting-minutes"
version = "0.1.0"
description = "Generate meeting minutes from video by combining ElevenLabs Scribe v2 transcripts with frame-change visual analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "elevenlabs>=2.52.0",
    "numpy>=2.4.6",
    "openai>=2.41.0",
    "opencv-python-headless>=4.13.0.92",
    "python-dotenv>=1.2.2",
]

[project.scripts]
video-meeting-minutes = "video_meeting_minutes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video_meeting_minutes"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
